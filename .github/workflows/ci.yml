# Владелец файла — архитектор. Барьер приёмки: задача не принимается, пока CI не зелёный.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-linux:
    # Модули DEV-2 обязаны собираться без macOS-фреймворков — эта работа проверяет
    # именно это: если в Packages/Core просочился импорт AppKit или AVFoundation,
    # облачная сессия DEV-2 перестанет собирать свои тесты, и увидим мы это здесь.
    #
    # Стиль здесь НЕ проверяется, и это сказано вслух намеренно. Причина: линтует
    # работа «Core + Mac» всё дерево репозитория целиком, включая Packages/Core —
    # то есть ровно те же файлы, что собираются здесь. Второй прогон на Linux дал
    # бы дубль тех же файлов более слабым набором правил (сборка swiftlint под
    # Linux идёт без SourceKit, часть правил в ней недоступна) и завёл бы риск
    # расхождения вердиктов между работами. Барьер по стилю — один, и он на macOS.
    name: Core (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      # `id` заведён изданием 11 и несущий: это единственная настоящая
      # предпосылка тестового шага ниже, и он гейтится на неё поимённо, а не на
      # порядок шагов. Без `id` условие пришлось бы писать через `success()`,
      # то есть снова через «все предыдущие», — ровно то, что издание 11 чинит.
      - id: build-core
        run: swift build --package-path Packages/Core

      # Разбор символьного графа — способ проверки, который девять контрактов
      # называют для границы модуля (перечень и счёт — в отчёте по MEE-166), а
      # критерий 45 MEE-74 уже записан под него. В ci.yml до этого шага не было ни
      # одного вхождения слова symbol: пункты были описаны и не снимаемы ничем.
      #
      # Шаг обязан стоять в ОБЕИХ работах, и это не перестраховка. Граф снимается
      # на одной платформе за прогон (инвариант 32 C-014, граница вторая):
      # публичное объявление под `#if os(macOS)` в графе этой работы не появится
      # вовсе, а за `#if` прячут именно системные типы. Снятый в одной работе,
      # пункт зелен по построению на всём, что условная компиляция скрыла.
      #
      # Стоит до `swift test` по доводу шага SwiftLint в работе ниже: падение
      # чужого теста не должно уносить с собой этот вердикт.
      - name: Символьный граф (Packages/Core)
        # `shell: bash` здесь несущий, а не украшение. Шаг `run` без явного shell
        # исполняется оболочкой по умолчанию, и в контейнере это может быть `sh`
        # (в образе jammy — dash). У dash нет опции `-o pipefail`: строка `set -o
        # pipefail` там не настройка, а незаконная опция, и шаг умирает на первой
        # же строке с кодом 2, не выведя ничего, — ровно это и случилось на первом
        # прогоне PR #12. `shell: bash` даёт `bash --noprofile --norc -eo pipefail`.
        shell: bash
        env:
          # Отчёт шага написан кириллицей. Без этого в локали C поток вывода
          # Python получает кодировку ascii, и шаг падает на собственном отчёте,
          # ничего не сказав о поверхности.
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/symbol-graph.log"
          status=0
          ( set -eux
            # Отсутствие python3 — отказ, а не пропуск. Ветка «шаг пропущен»
            # уже была у SwiftLint, и шаг зеленел, ничего не проверив (MEE-91).
            command -v python3
            python3 --version
            ls -l .github/scripts
            python3 .github/scripts/symbol-graph-surface.py --self-test
            graph_dir="$RUNNER_TEMP/symbol-graph-core"
            rm -rf "$graph_dir"
            mkdir -p "$graph_dir"
            swift build --package-path Packages/Core \
              -Xswiftc -emit-symbol-graph \
              -Xswiftc -emit-symbol-graph-dir -Xswiftc "$graph_dir"
            ls -l "$graph_dir"
            python3 .github/scripts/symbol-graph-surface.py \
              --graph-dir "$graph_dir" \
              --sources Packages/Core/Sources \
              --job "Core (Linux)"
          ) 2>&1 | tee "$log" || status=$?
          # Свой вердикт — число таргетов и число нарушений — разбор графа
          # выносит аннотацией сам. Строка ниже нужна на один случай: шаг упал
          # до того, как разбор сказал хоть слово, и тогда в аннотацию уходит
          # хвост журнала. Иначе причина такого отказа видна только тому, у кого
          # есть доступ к хранилищу логов Actions.
          bash .github/scripts/annotate.sh "Символьный граф · Core (Linux)" "$status" "$log" || true
          exit $status

      # Исход шага называл таргет, а не вектор: в сессии без сырых логов
      # красная CI говорила «что-то в Core упало», а не «упал Q50» (MEE-263).
      # Разложить весь файл по векторам отвергнуто: это заводит зависимость
      # чужой зоны — всякий новый вектор плана требовал бы правки этого файла
      # рукой архитектора, — и платится шагом за вектор. Поэтому вектор
      # называет не имя шага, а аннотация: имена упавших тестов уходят в
      # `::error`, а `check-runs/<job>/annotations` читается тем же способом
      # и там же, где `runs/<id>/jobs` (замер DEV-1, 16.09). Поимённый исход
      # получается без единой прочитанной строки лога и без служебной ветки
      # с разложенными по векторам шагами — той, что уже была оплачена раз.
      - name: Тесты · Packages/Core
        # Издание 11. Раньше здесь не стояло ничего, и по умолчанию шаг гейтился
        # на `success()` — то есть на успех ВСЕХ предыдущих шагов работы. Имена
        # упавших тестов, ради которых издание 10 правило этот файл, не
        # печатались тогда ни одного, если до них падал разбор символьного графа:
        # вердикт по стилю поверхности уносил с собой поимённый исход по тестам.
        # Теперь шаг гейтится на свою настоящую предпосылку — сборку — и только
        # на неё. Цена обратного решения названа и уплачена: `АИ.3`, где
        # `Packages/Mac` под мутацией не был измерен ровно поэтому.
        #
        # `!cancelled()`, а не `always()`: отменённый прогон обязан умирать
        # целиком — там минуты раннера тратятся зря по-настоящему, потому что
        # исход уже никому не нужен. Упавшая сборка тоже не доходит до тестов,
        # и это тот довод против `always()`, который назвал QA: гонять тесты по
        # заведомо несобранному дереву значит платить минутами за нулевой исход.
        if: ${{ !cancelled() && steps.build-core.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/tests-Core.log"
          status=0
          swift test --package-path Packages/Core 2>&1 | tee "$log" || status=$?
          # `|| true` здесь несущий, а не украшение: шаг идёт под `bash -eo
          # pipefail`, а grep без совпадений возвращает 1 — без guard зелёный
          # прогон умирал бы на собственной аннотации.
          failed=$(grep -hoE "Test Case '[^']+' failed" "$log" | cut -d"'" -f2 | sort -u || true)
          if [ -n "$failed" ]; then
            while IFS= read -r name; do
              printf '::error title=Упал тест · Packages/Core::%s\n' "$name"
            done <<< "$failed"
            # Издание 12. Уведомление и строка XCTest считают РАЗНОЕ, и до этой
            # правки обе величины стояли в одном журнале, не назвав своего
            # предмета ни одна: `sort -u` выше считает РАЗЛИЧНЫЕ ИМЕНА упавших
            # тестов, а `Executed N tests, with M failures` — ПРОВАЛИВШИЕСЯ
            # УТВЕРЖДЕНИЯ, которых у одного имени бывает несколько. Прогон 128
            # (работа 104943671531): 11 утверждений в 7 именах; прогон 136
            # (работа 104957082353): 17 и 10. Противоречия между ними нет —
            # читатель получал два ответа на один вопрос, и чаще всего ровно
            # ОДИН из них: уведомление печатается последними строками шага и
            # попадает в хвост журнала, а строка `Executed …` лежит за
            # полусотней строк дампа символов выше и хвостом в 44 строки уже
            # не ловится (замер издания 12, тот же журнал). Поэтому обе
            # величины печатаются рядом и каждая со своим именем.
            names=$(printf '%s\n' "$failed" | wc -l | tr -d ' ')
            # `|| true` здесь по тому же доводу, что у `grep` выше: строки
            # `Executed` в журнале может не быть вовсе — шаг мог умереть
            # раньше, — и тогда печатается то, что есть, а не выдумывается
            # второе число.
            asserts=$(grep -hoE 'Executed [0-9]+ tests, with [0-9]+ failure' "$log" \
              | tail -1 | sed -E 's/.*with ([0-9]+) failure.*/\1/' || true)
            if [ -n "$asserts" ]; then
              printf '::notice title=Тесты · Packages/Core::упало тестов: %s (различных имён); провалившихся утверждений XCTest: %s\n' \
                "$names" "$asserts"
            else
              printf '::notice title=Тесты · Packages/Core::упало тестов: %s (различных имён); строки XCTest «Executed …» в журнале нет\n' \
                "$names"
            fi
          fi
          # Шаг мог умереть до того, как XCTest сказал хоть слово: сборка,
          # оболочка, отсутствие тулчейна. Тогда имени теста в журнале нет
          # вовсе, и в аннотацию уходит хвост журнала — тот же приём и тот же
          # довод, что у разбора символьного графа выше.
          if [ "$status" -ne 0 ] && [ -z "$failed" ]; then
            bash .github/scripts/annotate.sh "Тесты · Packages/Core" "$status" "$log" || true
          fi
          exit $status

  macos:
    name: Core + Mac (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      # Линтера в образе macos-14 нет, поэтому он ставится явно. Раньше на его
      # отсутствие была ветка «шаг пропущен», и шаг зеленел, ничего не проверив:
      # .swiftlint.yml выглядел барьером, не будучи им. Теперь возможных исходов
      # два — линтер отработал либо работа красная (MEE-91).
      - name: Установка SwiftLint
        run: |
          set -euo pipefail
          brew install swiftlint
          swiftlint version

      # Линт идёт до тестов намеренно. Стоял он последним, и падение любого
      # swift test уносило его с собой — проверка стиля просто не доходила до
      # исполнения. Линт ничего не собирает и стоит секунды, так что здесь он
      # и дешевле, и его вердикт нельзя заслонить чужим падением.
      - name: SwiftLint
        run: |
          set -o pipefail
          version=$(swiftlint version)
          # `|| status=$?` здесь несущий, а не украшение. Шаг run без явного shell:
          # исполняется как `bash -e`, и раньше упавший конвейер обрывал шаг прямо на
          # этой строке: работа краснела верно, но вердикт ниже не выводился ровно тогда,
          # когда он нужнее всего, а `exit $status` был недостижим. Теперь оба исхода
          # доходят до аннотации, а код возврата линтера доезжает до вердикта шага.
          status=0
          swiftlint --strict --reporter github-actions-logging 2>&1 | tee "$RUNNER_TEMP/swiftlint.log" || status=$?
          verdict=$(grep -m1 'Done linting' "$RUNNER_TEMP/swiftlint.log" || echo "линт завершился с кодом $status")
          # Версия и вердикт выносятся отдельной аннотацией: «линтер отработал»
          # должно подтверждаться, не открывая журнал работы. Сами нарушения
          # репортер github-actions-logging вешает аннотациями на строки диффа.
          echo "::notice title=SwiftLint::$version — $verdict"
          exit $status

      - run: swift --version

      # Вторая половина шага, обязательная по той же границе способа: здесь граф
      # снимается на macOS, и в нём видно всё, что `Core (Linux)` от себя скрыла
      # условной компиляцией. Оба пакета — потому что `Packages/Mac` тянет из
      # `Packages/Core` только DomainCore и EngineKit, а таргеты Storage, GigaAM,
      # CalendarHub, ModelManager и Attribution в его графе не появятся вовсе.
      - name: Символьный граф (Packages/Core и Packages/Mac)
        id: graph
        # Издание 11. Раньше здесь не стояло ничего, и шаг гейтился на успех всех
        # предыдущих — то есть **одно нарушение стиля выключало разбор графа и
        # оба тестовых шага сразу**, и работа отдавала вердикт по линту и больше
        # ничего. SwiftLint ничего не собирает и к сборке отношения не имеет;
        # его вердикт — независимый, и заслонять им чужие запрещено тем же
        # доводом, которым линт был поднят выше тестов («его вердикт нельзя
        # заслонить чужим падением»). Порядок шагов решал эту задачу только
        # в одну сторону — он защищает ранние шаги от поздних и оставляет
        # последний шаг работы не защищённым ничем. `if:` решает её в обе.
        if: ${{ !cancelled() }}
        # Оболочка названа явно и здесь — чтобы обе половины одного шага
        # исполнялись одной оболочкой, а не по-разному в двух работах.
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/symbol-graph.log"
          status=0
          # Вердикт этого шага смешивает два разных отказа: НЕ СОБРАЛСЯ пакет и
          # НЕ СОШЛАСЬ его поверхность. Тестовым шагам ниже важен ровно первый, а
          # из кода возврата шага их не различить. Поэтому сборка помечает свой
          # отказ файлом, а шаг выносит это отдельным выходом `build_ok`.
          build_failed="$RUNNER_TEMP/symbol-graph-build-failed"
          rm -f "$build_failed"
          ( set -eux
            command -v python3
            python3 --version
            python3 .github/scripts/symbol-graph-surface.py --self-test
            # `|| inner=$?` несущий, как и у SwiftLint выше: вердикт по второму
            # пакету не должен пропадать из-за отказа по первому.
            inner=0
            for pkg in Core Mac; do
              graph_dir="$RUNNER_TEMP/symbol-graph-$pkg"
              rm -rf "$graph_dir"
              mkdir -p "$graph_dir"
              swift build --package-path "Packages/$pkg" \
                -Xswiftc -emit-symbol-graph \
                -Xswiftc -emit-symbol-graph-dir -Xswiftc "$graph_dir" \
                || { : > "$build_failed"; exit 1; }
              ls -l "$graph_dir"
              python3 .github/scripts/symbol-graph-surface.py \
                --graph-dir "$graph_dir" \
                --sources "Packages/$pkg/Sources" \
                --job "Core + Mac (macos-14) · Packages/$pkg" || inner=$?
            done
            exit $inner
          ) 2>&1 | tee "$log" || status=$?
          # Пишется ДО `exit $status`, потому что нужен он именно на красном
          # шаге: при зелёном тестовые шаги пошли бы и так.
          if [ -e "$build_failed" ]; then
            echo "build_ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_ok=true" >> "$GITHUB_OUTPUT"
          fi
          bash .github/scripts/annotate.sh "Символьный граф · Core + Mac" "$status" "$log" || true
          exit $status

      # Исход шага называл таргет, а не вектор: в сессии без сырых логов
      # красная CI говорила «что-то в Core упало», а не «упал Q50» (MEE-263).
      # Разложить весь файл по векторам отвергнуто: это заводит зависимость
      # чужой зоны — всякий новый вектор плана требовал бы правки этого файла
      # рукой архитектора, — и платится шагом за вектор. Поэтому вектор
      # называет не имя шага, а аннотация: имена упавших тестов уходят в
      # `::error`, а `check-runs/<job>/annotations` читается тем же способом
      # и там же, где `runs/<id>/jobs` (замер DEV-1, 16.09). Поимённый исход
      # получается без единой прочитанной строки лога и без служебной ветки
      # с разложенными по векторам шагами — той, что уже была оплачена раз.
      - name: Тесты · Packages/Core
        # Издание 11, тот же довод, что у графа выше: предпосылка тестов — сборка,
        # а не успех всех предыдущих шагов. Шаг переживает красный SwiftLint и
        # красный разбор поверхности и печатает имена; несобранное дерево его
        # по-прежнему не запускает, и минуты раннера на заведомо негодный прогон
        # не тратятся — это довод QA против `always()`, и он здесь исполнен.
        if: ${{ !cancelled() && steps.graph.outputs.build_ok == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/tests-Core.log"
          status=0
          swift test --package-path Packages/Core 2>&1 | tee "$log" || status=$?
          # `|| true` здесь несущий, а не украшение: шаг идёт под `bash -eo
          # pipefail`, а grep без совпадений возвращает 1 — без guard зелёный
          # прогон умирал бы на собственной аннотации.
          failed=$(grep -hoE "Test Case '[^']+' failed" "$log" | cut -d"'" -f2 | sort -u || true)
          if [ -n "$failed" ]; then
            while IFS= read -r name; do
              printf '::error title=Упал тест · Packages/Core::%s\n' "$name"
            done <<< "$failed"
            # Издание 12. Уведомление и строка XCTest считают РАЗНОЕ, и до этой
            # правки обе величины стояли в одном журнале, не назвав своего
            # предмета ни одна: `sort -u` выше считает РАЗЛИЧНЫЕ ИМЕНА упавших
            # тестов, а `Executed N tests, with M failures` — ПРОВАЛИВШИЕСЯ
            # УТВЕРЖДЕНИЯ, которых у одного имени бывает несколько. Прогон 128
            # (работа 104943671531): 11 утверждений в 7 именах; прогон 136
            # (работа 104957082353): 17 и 10. Противоречия между ними нет —
            # читатель получал два ответа на один вопрос, и чаще всего ровно
            # ОДИН из них: уведомление печатается последними строками шага и
            # попадает в хвост журнала, а строка `Executed …` лежит за
            # полусотней строк дампа символов выше и хвостом в 44 строки уже
            # не ловится (замер издания 12, тот же журнал). Поэтому обе
            # величины печатаются рядом и каждая со своим именем.
            names=$(printf '%s\n' "$failed" | wc -l | tr -d ' ')
            # `|| true` здесь по тому же доводу, что у `grep` выше: строки
            # `Executed` в журнале может не быть вовсе — шаг мог умереть
            # раньше, — и тогда печатается то, что есть, а не выдумывается
            # второе число.
            asserts=$(grep -hoE 'Executed [0-9]+ tests, with [0-9]+ failure' "$log" \
              | tail -1 | sed -E 's/.*with ([0-9]+) failure.*/\1/' || true)
            if [ -n "$asserts" ]; then
              printf '::notice title=Тесты · Packages/Core::упало тестов: %s (различных имён); провалившихся утверждений XCTest: %s\n' \
                "$names" "$asserts"
            else
              printf '::notice title=Тесты · Packages/Core::упало тестов: %s (различных имён); строки XCTest «Executed …» в журнале нет\n' \
                "$names"
            fi
          fi
          # Шаг мог умереть до того, как XCTest сказал хоть слово: сборка,
          # оболочка, отсутствие тулчейна. Тогда имени теста в журнале нет
          # вовсе, и в аннотацию уходит хвост журнала — тот же приём и тот же
          # довод, что у разбора символьного графа выше.
          if [ "$status" -ne 0 ] && [ -z "$failed" ]; then
            bash .github/scripts/annotate.sh "Тесты · Packages/Core" "$status" "$log" || true
          fi
          exit $status

      # Вторая половина того же приёма, по тому же доводу: вектор называет
      # аннотация, а не имя шага (MEE-263).
      - name: Тесты · Packages/Mac
        # Издание 11, и здесь цена прежнего поведения измерена поимённо: к этому
        # шагу стоят ШЕСТЬ предшествующих шагов своей работы, и падение любого из
        # шести выключало его целиком. `АИ.3` — `Packages/Mac` под мутацией не
        # измерен прогоном ровно поэтому: упал сосед, а не он. Таргеты Core и Mac
        # независимы, и вердикт по одному не вправе уносить вердикт по другому.
        if: ${{ !cancelled() && steps.graph.outputs.build_ok == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/tests-Mac.log"
          status=0
          swift test --package-path Packages/Mac 2>&1 | tee "$log" || status=$?
          # `|| true` здесь несущий, а не украшение: шаг идёт под `bash -eo
          # pipefail`, а grep без совпадений возвращает 1 — без guard зелёный
          # прогон умирал бы на собственной аннотации.
          failed=$(grep -hoE "Test Case '[^']+' failed" "$log" | cut -d"'" -f2 | sort -u || true)
          if [ -n "$failed" ]; then
            while IFS= read -r name; do
              printf '::error title=Упал тест · Packages/Mac::%s\n' "$name"
            done <<< "$failed"
            # Издание 12. Уведомление и строка XCTest считают РАЗНОЕ, и до этой
            # правки обе величины стояли в одном журнале, не назвав своего
            # предмета ни одна: `sort -u` выше считает РАЗЛИЧНЫЕ ИМЕНА упавших
            # тестов, а `Executed N tests, with M failures` — ПРОВАЛИВШИЕСЯ
            # УТВЕРЖДЕНИЯ, которых у одного имени бывает несколько. Прогон 128
            # (работа 104943671531): 11 утверждений в 7 именах; прогон 136
            # (работа 104957082353): 17 и 10. Противоречия между ними нет —
            # читатель получал два ответа на один вопрос, и чаще всего ровно
            # ОДИН из них: уведомление печатается последними строками шага и
            # попадает в хвост журнала, а строка `Executed …` лежит за
            # полусотней строк дампа символов выше и хвостом в 44 строки уже
            # не ловится (замер издания 12, тот же журнал). Поэтому обе
            # величины печатаются рядом и каждая со своим именем.
            names=$(printf '%s\n' "$failed" | wc -l | tr -d ' ')
            # `|| true` здесь по тому же доводу, что у `grep` выше: строки
            # `Executed` в журнале может не быть вовсе — шаг мог умереть
            # раньше, — и тогда печатается то, что есть, а не выдумывается
            # второе число.
            asserts=$(grep -hoE 'Executed [0-9]+ tests, with [0-9]+ failure' "$log" \
              | tail -1 | sed -E 's/.*with ([0-9]+) failure.*/\1/' || true)
            if [ -n "$asserts" ]; then
              printf '::notice title=Тесты · Packages/Mac::упало тестов: %s (различных имён); провалившихся утверждений XCTest: %s\n' \
                "$names" "$asserts"
            else
              printf '::notice title=Тесты · Packages/Mac::упало тестов: %s (различных имён); строки XCTest «Executed …» в журнале нет\n' \
                "$names"
            fi
          fi
          # Шаг мог умереть до того, как XCTest сказал хоть слово: сборка,
          # оболочка, отсутствие тулчейна. Тогда имени теста в журнале нет
          # вовсе, и в аннотацию уходит хвост журнала — тот же приём и тот же
          # довод, что у разбора символьного графа выше.
          if [ "$status" -ne 0 ] && [ -z "$failed" ]; then
            bash .github/scripts/annotate.sh "Тесты · Packages/Mac" "$status" "$log" || true
          fi
          exit $status
