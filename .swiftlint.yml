# Владелец файла — архитектор.
excluded:
  - Packages/Core/.build
  - Packages/Mac/.build
  - spikes

line_length:
  warning: 120
  error: 160

identifier_name:
  min_length: 2

disabled_rules:
  - todo

# trailing_comma действует на всё дерево. Исключение — два манифеста SPM
# (Packages/Core/Package.swift, Packages/Mac/Package.swift): висящая запятая в них
# не небрежность, а устоявшийся стиль манифестов — так пишет и сам
# swift-package-manager, и шаблоны Apple. Правило снято в самих этих файлах парой
# директив disable/enable: выключение видно тому, кто правит манифест, а остальные
# 29 файлов, включая весь продуктовый код, правило продолжает проверять.
#
# Почему не настройкой. Опция mandatory_comma существует: TrailingCommaConfiguration,
# ключ mandatory_comma, по умолчанию false — проверено по исходникам SwiftLint 0.65.1,
# той самой версии, что стоит на раннере. Но она правило не сужает, а переворачивает:
# при true висящая запятая становится обязательной в каждом многострочном литерале,
# и красным станет продуктовый код, который её не ставит. Для нашей задачи опция не
# годится ни при каком значении.
#
# Почему не excluded. Манифесты потеряли бы заодно line_length — проверку ровно там,
# где строки в репозитории самые длинные.
#
# Почему пара disable/enable, а не одна строка disable. Правило blanket_disable_command
# включено по умолчанию и само считает нарушением disable без парного enable
# (trailing_comma в его allowed_rules не входит), а --strict превращает это в ошибку.
# Обратная страховка тоже стоит: superfluous_disable_command покраснеет, если висящие
# запятые из манифестов уйдут, а директивы останутся.
