# Владелец файла — архитектор.
excluded:
  - Packages/Core/.build
  - Packages/Mac/.build
  - spikes

line_length:
  warning: 120
  error: 160

identifier_name:
  min_length: 2

disabled_rules:
  - todo
  # trailing_comma запрещает висящую запятую в литералах коллекций, а оба
  # Package.swift её используют — это устоявшийся стиль манифестов SPM (так их
  # пишет и сам swift-package-manager, и шаблоны Apple), и правка манифестов
  # была бы изменением к худшему. Настройкой правило не разворачивается:
  # опции mandatory_comma в актуальном SwiftLint больше нет. Поэтому оно
  # выключено целиком — и выключено вслух, отдельным решением, а не тихо.
  # Альтернативой было вынести оба манифеста из-под линтера совсем, но это
  # стоило бы им заодно и line_length, то есть проверки ровно там, где строки
  # в репозитории самые длинные. Все прочие правила действуют на все файлы.
  - trailing_comma
